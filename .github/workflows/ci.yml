name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (numpy/scipy/scikit-learn/matplotlib + torch CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import every module (catches API drift)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "
          import importlib
          for m in ('augment', 'baseline', 'config', 'dataset', 'download',
                    'evaluate', 'extract', 'metadata', 'model',
                    'results_table', 'synthetic', 'train', 'visualize'):
              importlib.import_module(f'sign_language.{m}')
          print('all modules import')
          "
      - name: Smoke training on synthetic landmarks
        run: |
          python -m sign_language.synthetic
          python -m sign_language.train --smoke --epochs 2
          python -m sign_language.results_table
          python -m sign_language.visualize
      - name: Lint
        run: python -m ruff check .
